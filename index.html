<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <title>ICT280 Website</title>
            <link rel="stylesheet" href="css/styles.css">
        </head>
        <body class="home">

            <h1>ICT280 Website</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="project4/project4.html">Project 4: Cats</a>
            </nav>
    
            <p>Welcome to my course website.</p>
    
            <figure>
                <img src="Images/alvaro-montoro-BlackCat.jpg" alt="Black cat portrait sitting and looking at camera" width="300">
            <figcaption>
                <p>Photo by alvaro-montoro on Unsplash</p>
            </figcaption>
            </figure>
            <a href="project4/project4.html">Learn more about cat breeds</a>

            <button id="open-form-btn" class="btn-open-form">Share Your Favorite Cat Breed</button>

            <section id="feedback-section" class="hidden">
                <h2>Share Your Favorite Cat Breed</h2>
                <form id="cat-form">
                    <div class="form-group">
                        <label for="name">Your Name:</label>
                        <input type="text" id="name" name="name" required placeholder="Enter your name">
                    </div>
                    
                    <div class="form-group">
                        <label for="comment">Your Favorite Cat Breed & Comment:</label>
                        <textarea id="comment" name="comment" required placeholder="Tell us about your favorite cat breed..."></textarea>
                    </div>
                    
                    <div class="form-buttons">
                        <button type="submit" class="btn-submit">Submit</button>
                        <button type="reset" class="btn-cancel">Cancel</button>
                    </div>
                </form>

                <div id="thank-you-message" class="hidden">
                    <p id="greeting-message"></p>
                    <p id="thank-you-text"></p>
                    <div class="response-buttons">
                        <button id="reset-btn" class="btn-new-feedback">Submit Another Response</button>
                        <button id="back-btn" class="btn-back">Back</button>
                    </div>
                </div>
            </section>

            <script src="javascript/script.js"></script>
        </body>
    </html>
